[package]
name = "grandcentury-desktop"
version = "1.7.0"
edition = "2021"
description = "Grand Century desktop shell"
authors = ["Lakeside Games"]
publish = false
license-file = "../../../LICENSE.md"
repository = "https://github.com/Egg3901/grand-century"
rust-version = "1.77.2"

[lib]
name = "grandcentury_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
