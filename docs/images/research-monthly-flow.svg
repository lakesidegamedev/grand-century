<text x="283.5" y="69.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Choose a target (player</text>
<text x="283.5" y="84" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">auto-picks at 1.5x the</text>
<text x="283.5" y="98.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">cheapest)</text>
<rect x="428.5" y="54" width="130" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="493.5" y="70.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Pay into the</text>
<text x="493.5" y="85.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">target</text>
<rect x="428.5" y="133.2" width="130" height="40" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="493.5" y="150" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Technology</text>
<text x="493.5" y="164.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">completes</text>
<rect x="188.5" y="133.2" width="190" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="283.5" y="148.7" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Modifiers flow out to</text>
<text x="283.5" y="163.2" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">economy, budget, population</text>
<text x="283.5" y="177.7" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">and war</text>
