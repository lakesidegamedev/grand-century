<polyline points="188.5,159.2 126,159.2 126,153.2" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<polyline points="71,173.2 71,212.4 91,212.4" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="16" y="54" width="110" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
