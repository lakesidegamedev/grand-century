<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Monthly flow. Earn points, choose a target (a player picks automatically at 1.5 times the cheapest), pay into the target, and the technology completes. Its modifiers flow out to economy, budget, population and war. Inventions roll, and literacy and prestige drips follow.">
<title>Monthly flow. Earn points, choose a target (a player picks automatically at 1.5 times the cheapest), pay into the target, and the technology completes. Its modifiers flow out to economy, budget, population and war. Inventions roll, and literacy and prestige drips follow.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="359" fill="#fff" stroke="#d4d4d8"/>
