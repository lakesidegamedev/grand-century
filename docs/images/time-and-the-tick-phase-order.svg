<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 532" width="640" height="532" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Phase order of one day: daily steps (market housekeeping, war), then weekly (begin week, production, pops shop, standing orders, settle producers, price move), then monthly (budget, population, culture, politics, research, diplomacy, crises, events, AI), then yearly (chronicle and autosave).">
