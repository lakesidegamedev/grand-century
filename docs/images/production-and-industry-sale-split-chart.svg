<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Stacked bars of where a week's sale value goes. A resource site pays 80 percent wages, 12 percent owners and 8 percent the state. A factory pays 45 percent wages, then inputs, operating cost, owners and plant. The second panel shows the worked examples in money.">
