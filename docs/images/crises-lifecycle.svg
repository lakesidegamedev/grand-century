<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" width="640" height="490" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Crisis lifecycle. Tension of at least 35 gives a spawn roll of 5 to 50 percent. A flashpoint appears (sphere contest, containment or humiliation). Blocs join at score 45. Temperature rises (press 18, join 6). At showdown, at 100 or the deadline, a power ratio of 1.45 or more gives a congress, under 1.45 gives a war, and a lost lead fizzles. An AI lead can back down early at ratio 0.62 and temperature 50 to 99.">
<title>Crisis lifecycle. Tension of at least 35 gives a spawn roll of 5 to 50 percent. A flashpoint appears (sphere contest, containment or humiliation). Blocs join at score 45. Temperature rises (press 18, join 6). At showdown, at 100 or the deadline, a power ratio of 1.45 or more gives a congress, under 1.45 gives a war, and a lost lead fizzles. An AI lead can back down early at ratio 0.62 and temperature 50 to 99.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="489" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">The life of a crisis</text>
<polyline points="150,82 220,82" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="350,82 420,82 420,90" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="495,126 495,171.6" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="420,199.6 350,199.6 350,207.6" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="220,207.6 150,207.6 150,213.6" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<polyline points="285,243.6 285,289.2" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="220,325.2 150,325.2" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<polyline points="350,325.2 420,325.2" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<polyline points="285,361.2 285,398.4" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<rect x="20" y="54" width="130" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="85" y="78.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Tension at 35 or</text>
<text x="85" y="93.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">more</text>
<rect x="220" y="54" width="130" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="285" y="78.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Spawn roll, 5% to</text>
<text x="285" y="93.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">50%</text>
<rect x="420" y="54" width="150" height="72" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="495" y="79.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Flashpoint: sphere</text>
<text x="495" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">contest, containment</text>
<text x="495" y="108.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">or humiliation</text>
<rect x="420" y="171.6" width="150" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="495" y="196.4" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Blocs join at score</text>
<text x="495" y="210.9" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">45</text>
<rect x="220" y="171.6" width="130" height="72" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="285" y="204.4" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Temperature rises:</text>
<text x="285" y="218.9" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">press +18, join +6</text>
<rect x="20" y="171.6" width="130" height="84" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="85" y="195.9" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">AI lead backs down</text>
<text x="85" y="210.4" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">early: ratio 0.62,</text>
<text x="85" y="224.9" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">temperature 50 to</text>
<text x="85" y="239.4" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">99</text>
<rect x="220" y="289.2" width="130" height="72" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="285" y="314.7" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Showdown at</text>
<text x="285" y="329.2" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">temperature 100 or</text>
<text x="285" y="343.7" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">the deadline</text>
<rect x="20" y="289.2" width="130" height="72" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="85" y="322" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Ratio 1.45 or</text>
<text x="85" y="336.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">more: congress</text>
<rect x="420" y="289.2" width="130" height="72" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="485" y="322" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">A lead is lost:</text>
<text x="485" y="336.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">fizzle</text>
<rect x="220" y="398.4" width="130" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="285" y="423.2" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Ratio under 1.45:</text>
<text x="285" y="437.7" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">war</text>
<text x="16" y="476" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">Backing a side changes the ratio, so check the forecast again after you join.</text>
</svg>
