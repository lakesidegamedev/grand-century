<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Sequence diagram. A UI command is applied by the worker and a snapshot is posted at once. While the clock runs, a pending snapshot is posted at most 8 times a second. A detail request returns a detail reply. In multiplayer the server builds a snapshot, the codec splits shared and player view, a gzip diff goes to the client, which applies it.">
<title>Sequence diagram. A UI command is applied by the worker and a snapshot is posted at once. While the clock runs, a pending snapshot is posted at most 8 times a second. A detail request returns a detail reply. In multiplayer the server builds a snapshot, the codec splits shared and player view, a gzip diff goes to the client, which applies it.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="519" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">How a snapshot reaches the screen</text>
<text x="16" y="50" font-size="12" text-anchor="start" fill="#27272a" font-weight="600">In the browser</text>
<rect x="10" y="58" width="140" height="28" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="80" y="76.2" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400">UI</text>
<line x1="80" y1="86" x2="80" y2="270" stroke="#a1a1aa" stroke-dasharray="4 4"/>
<rect x="200" y="58" width="140" height="28" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="270" y="76.2" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400">Worker</text>
<line x1="270" y1="86" x2="270" y2="270" stroke="#a1a1aa" stroke-dasharray="4 4"/>
<rect x="390" y="58" width="140" height="28" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="460" y="76.2" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400">Store and panels</text>
<line x1="460" y1="86" x2="460" y2="270" stroke="#a1a1aa" stroke-dasharray="4 4"/>
<polyline points="80,106 270,106" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<text x="175" y="100" font-size="11" text-anchor="middle" fill="#27272a" font-weight="400">command</text>
<text x="278" y="124" font-size="10.5" text-anchor="start" fill="#52525b" font-weight="400">applies it, marks a snapshot pending</text>
<polyline points="270,144 460,144" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<text x="365" y="138" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="400">snapshot posted at once</text>
<text x="278" y="168" font-size="10.5" text-anchor="start" fill="#52525b" font-weight="400">running clock: days advance, snapshot pending</text>
<polyline points="270,188 460,188" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<text x="365" y="182" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="400">posted at most 8 times a second</text>
<polyline points="80,216 270,216" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<text x="175" y="210" font-size="11" text-anchor="middle" fill="#27272a" font-weight="400">requestProvince or requestNation</text>
<polyline points="270,242 80,242" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<text x="175" y="236" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="400">detail reply</text>
<text x="16" y="288" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">Paused or unchanged: nothing is posted.</text>
<text x="16" y="318" font-size="12" text-anchor="start" fill="#27272a" font-weight="600">Multiplayer</text>
<rect x="10" y="326" width="140" height="28" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="80" y="344.2" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400">Server</text>
<line x1="80" y1="354" x2="80" y2="490" stroke="#a1a1aa" stroke-dasharray="4 4"/>
<rect x="200" y="326" width="140" height="28" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="270" y="344.2" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400">Codec</text>
<line x1="270" y1="354" x2="270" y2="490" stroke="#a1a1aa" stroke-dasharray="4 4"/>
<rect x="390" y="326" width="140" height="28" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="460" y="344.2" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400">Client</text>
<line x1="460" y1="354" x2="460" y2="490" stroke="#a1a1aa" stroke-dasharray="4 4"/>
<polyline points="80,382 270,382" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<text x="175" y="376" font-size="11" text-anchor="middle" fill="#27272a" font-weight="400">builds the snapshot</text>
<text x="278" y="404" font-size="10.5" text-anchor="start" fill="#52525b" font-weight="400">splits shared state from the player view</text>
<polyline points="270,430 460,430" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<text x="365" y="424" font-size="11" text-anchor="middle" fill="#27272a" font-weight="400">gzip diff</text>
<text x="468" y="452" font-size="10.5" text-anchor="start" fill="#52525b" font-weight="400">applies the diff</text>
</svg>
