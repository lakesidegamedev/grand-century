<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Threshold bar of bloc power ratio from 0 to 2: an AI crisis lead concedes below 0.62, an AI declares war for a minor goal from 1.08, for annexation from 1.25, and a congress forms at 1.45.">
<title>Threshold bar of bloc power ratio from 0 to 2: an AI crisis lead concedes below 0.62, an AI declares war for a minor goal from 1.08, for annexation from 1.25, and a congress forms at 1.45.</title>
<rect x="0.5" y="0.5" width="639" height="329" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">Where the AI acts on bloc power ratio</text>
<rect x="40" y="150" width="560" height="40" fill="#f4f4f5" fill-opacity="1" stroke="#d4d4d8"/>
<rect x="342.4" y="150" width="47.6" height="40" fill="#2563eb" fill-opacity="0.35"/>
<rect x="390" y="150" width="210" height="40" fill="#2563eb" fill-opacity="0.65"/>
<rect x="40" y="150" width="173.6" height="40" fill="#dc2626" fill-opacity="0.4"/>
<line x1="40" y1="190" x2="40" y2="196" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="40" y="210" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">0</text>
<line x1="110" y1="190" x2="110" y2="196" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="110" y="210" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">0.25</text>
<line x1="180" y1="190" x2="180" y2="196" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="180" y="210" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">0.5</text>
<line x1="250" y1="190" x2="250" y2="196" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="250" y="210" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">0.75</text>
<line x1="320" y1="190" x2="320" y2="196" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="320" y="210" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">1</text>
<line x1="390" y1="190" x2="390" y2="196" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="390" y="210" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">1.25</text>
<line x1="460" y1="190" x2="460" y2="196" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="460" y="210" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">1.5</text>
<line x1="530" y1="190" x2="530" y2="196" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="530" y="210" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">1.75</text>
<line x1="600" y1="190" x2="600" y2="196" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="600" y="210" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">2</text>
<text x="320" y="232" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400">Stronger bloc power divided by weaker bloc power</text>
<line x1="213.6" y1="82" x2="213.6" y2="150" stroke="#dc2626" stroke-width="1.4" stroke-opacity="1"/>
<text x="218.6" y="80" font-size="11" text-anchor="start" fill="#dc2626" font-weight="400">0.62: an AI crisis lead concedes</text>
<line x1="342.4" y1="102" x2="342.4" y2="150" stroke="#2563eb" stroke-width="1.4" stroke-opacity="1"/>
<text x="347.4" y="100" font-size="11" text-anchor="start" fill="#2563eb" font-weight="400">1.08: AI declares for a minor goal</text>
<line x1="390" y1="122" x2="390" y2="150" stroke="#2563eb" stroke-width="1.4" stroke-opacity="1"/>
<text x="395" y="120" font-size="11" text-anchor="start" fill="#2563eb" font-weight="400">1.25: AI declares for annexation</text>
<line x1="446" y1="142" x2="446" y2="150" stroke="#27272a" stroke-width="1.4" stroke-opacity="1"/>
<text x="451" y="140" font-size="11" text-anchor="start" fill="#27272a" font-weight="400">1.45: a congress forms</text>
<text x="40" y="280" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">The other side of the crisis concedes at the same line seen from the stronger bloc: above 1.61.</text>
</svg>
