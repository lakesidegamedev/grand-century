<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Factory week flow: buy inputs, produce limited by inputs and workers, register supply, the market clears, settle by the fraction sold, pay wages (45 percent), take operating cost, owners get 55 percent of net, the rest goes to the plant cash reserve. Side branches: expand after 26 profitable weeks, shrink after 6 loss weeks, close after 10 loss weeks at level 1.">
<title>Factory week flow: buy inputs, produce limited by inputs and workers, register supply, the market clears, settle by the fraction sold, pay wages (45 percent), take operating cost, owners get 55 percent of net, the rest goes to the plant cash reserve. Side branches: expand after 26 profitable weeks, shrink after 6 loss weeks, close after 10 loss weeks at level 1.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="429" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">One week in a factory</text>
<polyline points="132,82 172,82" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="284,82 324,82 324,74" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="436,74 476,74" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="532,94 532,120" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="476,148 436,148 436,140" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="324,140 284,140" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="172,140 132,140" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="76,160 76,186" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="132,206 324,233.1" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<polyline points="132,206 324,285.9" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<polyline points="132,206 324,338.7" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<rect x="20" y="54" width="112" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="76" y="86" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Buy inputs</text>
<rect x="172" y="54" width="112" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="228" y="64.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Produce,</text>
<text x="228" y="78.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">limited by</text>
<text x="228" y="93.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">inputs and</text>
<text x="228" y="107.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">workers</text>
<rect x="324" y="54" width="112" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="78" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Register supply</text>
<rect x="476" y="54" width="112" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="532" y="78" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Market clears</text>
<rect x="476" y="120" width="112" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="532" y="144.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Settle by the</text>
<text x="532" y="159.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">fraction sold</text>
<rect x="324" y="120" width="112" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="144" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Pay wages 45%</text>
<rect x="172" y="120" width="112" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="228" y="144" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Operating cost</text>
<rect x="20" y="120" width="112" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="76" y="136.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Owners 55% of</text>
<text x="76" y="151.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">net</text>
<rect x="20" y="186" width="112" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="76" y="202.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="600">Profit to cash</text>
<text x="76" y="217.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="600">reserve</text>
<rect x="324" y="209.1" width="150" height="48" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="399" y="229.9" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Expand: 26 profitable</text>
<text x="399" y="244.4" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">weeks in a row</text>
<rect x="324" y="261.9" width="150" height="48" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="399" y="282.7" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Shrink: 6 loss weeks</text>
<text x="399" y="297.2" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">in a row</text>
<rect x="324" y="314.7" width="150" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="399" y="335.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Close: 10 loss weeks</text>
<text x="399" y="350" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">at level 1</text>
<text x="16" y="416" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">The weekly result decides whether the plant grows, shrinks or closes.</text>
</svg>
