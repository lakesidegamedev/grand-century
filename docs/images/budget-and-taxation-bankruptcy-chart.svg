<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Line chart of treasury over months: 400 falling to -800 and -2,000, bankrupt past the -1,800 line, then recovering by 665 a month to 660, above the 550 exit line. A dashed line shows the treasury barely moving if nothing changes.">
