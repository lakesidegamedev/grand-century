<line x1="76" y1="343" x2="96" y2="343" stroke="#2563eb" stroke-width="2.5" stroke-opacity="1"/>
<text x="102" y="347" font-size="11.5" text-anchor="start" fill="#27272a" font-weight="400">Net +665 after cutting bills</text>
<line x1="76" y1="360" x2="96" y2="360" stroke="#dc2626" stroke-width="2.5" stroke-opacity="1" stroke-dasharray="6 4"/>
<text x="102" y="364" font-size="11.5" text-anchor="start" fill="#27272a" font-weight="400">Do nothing: net -35 a month</text>
<rect x="76" y="371" width="12" height="12" fill="#dc2626" fill-opacity="0.18"/>
<text x="94" y="381" font-size="11.5" text-anchor="start" fill="#27272a" font-weight="400">Bankrupt</text>
<text x="16" y="402" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">Treasury is limited to -30,000 at the bottom and 600,000 at the top.</text>
</svg>
