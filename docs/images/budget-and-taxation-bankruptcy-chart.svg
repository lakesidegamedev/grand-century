<text x="306" y="306" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">3</text>
<line x1="384" y1="46" x2="384" y2="290" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="384" y="306" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">4</text>
