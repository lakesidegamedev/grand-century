<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Bar chart of the chance that an event fires at a check against the number of eligible events, for events with mean time to happen 100 months and 12 months. Slow events add very little, while faster ones reach the 42 percent cap.">
