<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" width="640" height="314" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Phase order of runAiMonthly: every month, tax stabilization, peace check, war movement, mobilization and formables; then on heavy months, which come every third month for each nation, reforms, factory, military build, diplomacy, colonies and spheres, and formables.">
<title>Phase order of runAiMonthly: every month, tax stabilization, peace check, war movement, mobilization and formables; then on heavy months, which come every third month for each nation, reforms, factory, military build, diplomacy, colonies and spheres, and formables.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="313" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">Monthly AI pass order</text>
<rect x="10" y="58" width="620" height="64" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
<text x="44" y="86.7" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">Every</text>
<text x="44" y="101.7" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">month</text>
<rect x="80" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="86.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Tax</text>
<text x="130" y="101.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">stabilization</text>
<polyline points="181,90 191,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="192" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="242" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Peace check</text>
<polyline points="293,90 303,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="304" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="354" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">War movement</text>
<polyline points="405,90 415,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="416" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="466" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Mobilization</text>
<polyline points="517,90 527,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="528" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="578" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Formables</text>
<rect x="10" y="130" width="620" height="138" rx="8" fill="#fef2f2" stroke="#e4e4e7"/>
<text x="44" y="195.7" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">Heavy</text>
<text x="44" y="210.7" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">months</text>
<rect x="80" y="142" width="100" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="130" y="166" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Reforms</text>
<polyline points="181,162 191,162" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="192" y="142" width="100" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="242" y="166" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Factory</text>
<polyline points="293,162 303,162" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="304" y="142" width="100" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="354" y="158.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Military</text>
<text x="354" y="173.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">build</text>
<polyline points="405,162 415,162" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="416" y="142" width="100" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="466" y="166" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Diplomacy</text>
<polyline points="517,162 527,162" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="528" y="142" width="100" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="578" y="158.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Colonies and</text>
<text x="578" y="173.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">spheres</text>
<polyline points="578,183 578,199 130,199 130,215" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="80" y="216" width="100" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="130" y="240" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Formables</text>
<polyline points="550,111 550,118 102,118 102,141" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<rect x="467.2" y="109.8" width="166.8" height="16.5" fill="#fff" fill-opacity="0.92" rx="3"/>
<text x="550.6" y="121.3" font-size="10.5" text-anchor="middle" fill="#2563eb" font-weight="400">every third month per nation</text>
<text x="16" y="298" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">Heavy planning is staggered so nations do not all plan in the same month.</text>
</svg>
