<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Loop diagram. Pop needs, militancy, consciousness and ideology produce a reform demand. The demand is either enacted or refused. A refused demand raises militancy, which raises state unrest risk. After 6 hot months a rebellion spawns with that demand. Suppression, set by franchise, press rights and government, adds militancy, and literacy feeds research and consciousness.">
<title>Loop diagram. Pop needs, militancy, consciousness and ideology produce a reform demand. The demand is either enacted or refused. A refused demand raises militancy, which raises state unrest risk. After 6 hot months a rebellion spawns with that demand. Suppression, set by franchise, press rights and government, adds militancy, and literacy feeds research and consciousness.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="419" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">The reform and unrest loop</text>
<polyline points="140,86 166,86 166,92" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="296,92 322,92" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="452,92 478,92" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="387,130 387,165" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<rect x="363.2" y="139.3" width="47.7" height="16.5" fill="#fff" fill-opacity="0.92" rx="3"/>
<text x="387" y="150.8" font-size="10.5" text-anchor="middle" fill="#dc2626" font-weight="400">blocked</text>
<polyline points="322,190 296,190" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<polyline points="140,203 166,203 166,190" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<polyline points="231,215 231,253.8" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<polyline points="296,278.8 322,278.8 322,291.8" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<polyline points="231,165 231,130" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<rect x="10" y="54" width="130" height="64" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="75" y="75.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Literacy (feeds</text>
<text x="75" y="90" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">consciousness and</text>
<text x="75" y="104.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">research)</text>
<rect x="166" y="54" width="130" height="76" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="231" y="74.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Pop needs,</text>
<text x="231" y="88.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">militancy,</text>
<text x="231" y="103.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">consciousness,</text>
<text x="231" y="117.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">ideology</text>
<rect x="322" y="54" width="130" height="76" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="387" y="96" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Reform demand</text>
<rect x="478" y="54" width="130" height="76" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="543" y="81.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Enacted if the</text>
<text x="543" y="96" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">upper house passes</text>
<text x="543" y="110.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">it</text>
<rect x="10" y="165" width="130" height="76" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="75" y="192.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Suppression:</text>
<text x="75" y="207" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">franchise, press</text>
<text x="75" y="221.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">rights, government</text>
<rect x="166" y="165" width="130" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="231" y="194" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Militancy rises</text>
<rect x="322" y="165" width="130" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="387" y="194" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Demand refused</text>
<rect x="166" y="253.8" width="130" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="231" y="282.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">State unrest risk</text>
<rect x="322" y="253.8" width="130" height="76" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="387" y="281.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">After 6 hot</text>
<text x="387" y="295.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">months: rebellion</text>
<text x="387" y="310.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">with the demand</text>
<text x="16" y="406" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">A refused demand raises militancy, which raises the next demand.</text>
</svg>
