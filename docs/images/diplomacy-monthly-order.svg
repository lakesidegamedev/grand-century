<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 242" width="640" height="242" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Phase order of runDiplomacyMonthly: clear expired relations, rank great powers, drift opinions, accrue and spend influence, DP accrual, pretext queues, infamy decay and coalitions, then sphere income and prestige decay.">
<title>Phase order of runDiplomacyMonthly: clear expired relations, rank great powers, drift opinions, accrue and spend influence, DP accrual, pretext queues, infamy decay and coalitions, then sphere income and prestige decay.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="241" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">Monthly diplomacy pass order</text>
<rect x="10" y="58" width="620" height="138" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
<text x="44" y="123.7" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">Diplomacy,</text>
<text x="44" y="138.7" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">monthly</text>
<rect x="80" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="86.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Clear expired</text>
<text x="130" y="101.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">relations</text>
<polyline points="181,90 191,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="192" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="242" y="86.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Rank great</text>
<text x="242" y="101.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">powers</text>
<polyline points="293,90 303,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="304" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="354" y="86.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Drift</text>
<text x="354" y="101.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">opinions</text>
<polyline points="405,90 415,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="416" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="466" y="79.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Accrue and</text>
<text x="466" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">spend</text>
<text x="466" y="108.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">influence</text>
<polyline points="517,90 527,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="528" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="578" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">DP accrual</text>
<polyline points="578,111 578,127 130,127 130,143" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="80" y="144" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="160.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Pretext</text>
