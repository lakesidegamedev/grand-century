<polyline points="181,164 191,164" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="192" y="144" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="242" y="153.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Infamy decay</text>
<text x="242" y="168" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">and</text>
<text x="242" y="182.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">coalitions</text>
<polyline points="293,164 303,164" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="304" y="144" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="354" y="153.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Sphere income</text>
<text x="354" y="168" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">and prestige</text>
<text x="354" y="182.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">decay</text>
<text x="16" y="226" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">Runs on the 1st, after research and before crises.</text>
