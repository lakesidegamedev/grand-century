<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" width="640" height="314" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Seven-step weekly price pipeline: effective demand and supply, pressure, damping, base reversion, bounds, smoothing, then the new price.">
<title>Seven-step weekly price pipeline: effective demand and supply, pressure, damping, base reversion, bounds, smoothing, then the new price.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="313" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">The weekly price step</text>
<rect x="10" y="58" width="620" height="138" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
<text x="44" y="123.7" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">Each</text>
<text x="44" y="138.7" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">good</text>
<rect x="80" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="79.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">1. Effective</text>
<text x="130" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">demand and</text>
<text x="130" y="108.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">supply</text>
<polyline points="181,90 191,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="192" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="242" y="72.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">2. Pressure:</text>
<text x="242" y="86.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">log of the</text>
<text x="242" y="101.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">ratio,</text>
<text x="242" y="115.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">clamped</text>
<polyline points="293,90 303,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="304" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="354" y="72.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">3. Damping:</text>
<text x="354" y="86.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">price x</text>
<text x="354" y="101.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">exp(pressure</text>
<text x="354" y="115.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">x 0.09)</text>
<polyline points="405,90 415,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="416" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="466" y="72.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">4. Base</text>
<text x="466" y="86.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">reversion: 6%</text>
<text x="466" y="101.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">pull to base</text>
<text x="466" y="115.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">price</text>
<polyline points="517,90 527,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="528" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="578" y="79.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">5. Bounds:</text>
<text x="578" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">0.35x to 6x</text>
<text x="578" y="108.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">base</text>
<polyline points="578,111 578,127 130,127 130,143" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="80" y="144" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="153.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">6. Smoothing:</text>
<text x="130" y="168" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">move 32% of</text>
<text x="130" y="182.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">the gap</text>
<rect x="10" y="204" width="620" height="64" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
<text x="44" y="240.2" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">Result</text>
<rect x="80" y="216" width="100" height="40" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="130" y="240" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">7. New price</text>
<polyline points="102,185 102,192 102,192 102,215" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<text x="16" y="298" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">Runs once a week for every good, after buyers and settlement.</text>
</svg>
