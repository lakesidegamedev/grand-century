<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Three boxes: the UI thread with React, Zustand store, src/ui and src/map; the message protocol ToWorker and FromWorker; and the worker sim.worker.ts wrapping src/sim. Commands go down, world snapshots come up, and province and nation detail requests go down with detail replies up. A dashed link shows the Node multiplayer server reusing src/sim.">
<title>Three boxes: the UI thread with React, Zustand store, src/ui and src/map; the message protocol ToWorker and FromWorker; and the worker sim.worker.ts wrapping src/sim. Commands go down, world snapshots come up, and province and nation detail requests go down with detail replies up. A dashed link shows the Node multiplayer server reusing src/sim.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="379" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">The UI and simulation boundary</text>
<rect x="20" y="64" width="160" height="96" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="100" y="94.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">UI thread</text>
<text x="100" y="108.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">React, Zustand store</text>
<text x="100" y="123.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">src/ui, src/map</text>
<text x="100" y="137.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">(read-only snapshot)</text>
<rect x="240" y="64" width="160" height="96" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="320" y="101.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Message protocol</text>
<text x="320" y="116" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">ToWorker</text>
<text x="320" y="130.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">FromWorker</text>
<rect x="460" y="64" width="160" height="96" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="540" y="94.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Worker</text>
<text x="540" y="108.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">src/worker/sim.worker.ts</text>
<text x="540" y="123.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">wraps src/sim</text>
<text x="540" y="137.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">(World, systems)</text>
<polyline points="182,80 238,80" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<rect x="185.2" y="63.5" width="49.6" height="17" fill="#fff" fill-opacity="0.92" rx="3"/>
<text x="210" y="75.5" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="400">Command</text>
<polyline points="458,100 402,100" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<rect x="402.2" y="83.5" width="55.5" height="17" fill="#fff" fill-opacity="0.92" rx="3"/>
<text x="430" y="95.5" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="400">Snapshot</text>
<polyline points="182,124 238,124" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<rect x="165.5" y="130" width="89" height="28" fill="#fff" fill-opacity="0.92" rx="3"/>
<text x="210" y="141" font-size="10" text-anchor="middle" fill="#2563eb" font-weight="400">requestProvince</text>
<text x="210" y="153" font-size="10" text-anchor="middle" fill="#2563eb" font-weight="400">requestNation</text>
<polyline points="458,130 402,130" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<rect x="388.2" y="136" width="83.6" height="28" fill="#fff" fill-opacity="0.92" rx="3"/>
<text x="430" y="147" font-size="10" text-anchor="middle" fill="#dc2626" font-weight="400">provinceDetail</text>
<text x="430" y="159" font-size="10" text-anchor="middle" fill="#dc2626" font-weight="400">nationDetail</text>
<polyline points="402,80 458,80" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="402,124 458,124" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<rect x="380" y="250" width="240" height="64" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="500" y="278.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Node multiplayer server (server/)</text>
<text x="500" y="293.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">imports the same src/sim</text>
<polyline points="540,248 540,162" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<text x="16" y="210" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">Solid arrows are messages across the worker boundary.</text>
<text x="16" y="228" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">The UI never touches the World directly; it reads snapshots.</text>
<text x="16" y="346" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">Dashed: the multiplayer server runs the same simulation code, outside the browser.</text>
</svg>
