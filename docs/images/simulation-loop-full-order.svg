<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 552" width="640" height="552" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Timeline of one advanceDay call with daily, weekly, monthly and yearly lanes in function order. Labelled arrows mark the load-bearing pairs: culture before politics, settlement after buyers, price move last in the week, budget first and AI last in the month.">
