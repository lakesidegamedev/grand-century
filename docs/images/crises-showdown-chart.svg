<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Bar of power ratio from 0.5 to 2.5 split into outcome bands: an AI lead backs down early below 0.62, the other side wins a congress up to 0.69, a bloc war between 0.69 and 1.45, and a congress for you at 1.45 or more.">
<title>Bar of power ratio from 0.5 to 2.5 split into outcome bands: an AI lead backs down early below 0.62, the other side wins a congress up to 0.69, a bloc war between 0.69 and 1.45, and a congress for you at 1.45 or more.</title>
<rect x="0.5" y="0.5" width="639" height="299" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">What happens at showdown, by your bloc's power ratio</text>
<rect x="40" y="90" width="33.6" height="56" fill="#dc2626" fill-opacity="0.55"/>
<rect x="73.6" y="90" width="19.5" height="56" fill="#dc2626" fill-opacity="0.25"/>
<rect x="93.1" y="90" width="212.9" height="56" fill="#71717a" fill-opacity="0.85"/>
<text x="199.55" y="123" font-size="12.5" text-anchor="middle" fill="#fff" font-weight="600">War</text>
<rect x="306" y="90" width="294" height="56" fill="#2563eb" fill-opacity="0.7"/>
<text x="453" y="123" font-size="12.5" text-anchor="middle" fill="#fff" font-weight="600">You win</text>
<line x1="40" y1="146" x2="40" y2="153" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="40" y="168" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">0.5</text>
<line x1="93.1" y1="146" x2="93.1" y2="153" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="93.1" y="168" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">0.69</text>
<line x1="180" y1="146" x2="180" y2="153" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="180" y="168" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">1</text>
<line x1="306" y1="146" x2="306" y2="153" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="306" y="168" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">1.45</text>
<line x1="460" y1="146" x2="460" y2="153" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="460" y="168" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">2</text>
<line x1="600" y1="146" x2="600" y2="153" stroke="#27272a" stroke-width="1" stroke-opacity="1"/>
<text x="600" y="168" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">2.5</text>
<line x1="73.6" y1="146" x2="73.6" y2="153" stroke="#dc2626" stroke-width="1" stroke-opacity="1"/>
<text x="320" y="192" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400">Your bloc power divided by the other bloc power</text>
<line x1="73.6" y1="53" x2="73.6" y2="90" stroke="#dc2626" stroke-width="1.2" stroke-opacity="1"/>
<text x="78.6" y="52" font-size="11" text-anchor="start" fill="#dc2626" font-weight="400">Below 0.62 an AI lead folds early</text>
<line x1="93.1" y1="71" x2="93.1" y2="90" stroke="#dc2626" stroke-width="1.2" stroke-opacity="1"/>
<text x="98.1" y="70" font-size="11" text-anchor="start" fill="#dc2626" font-weight="400">0.62 to 0.69: congress for the other side</text>
<line x1="306" y1="53" x2="306" y2="90" stroke="#2563eb" stroke-width="1.2" stroke-opacity="1"/>
<text x="311" y="52" font-size="11" text-anchor="start" fill="#2563eb" font-weight="400">1.45 or more: congress for you</text>
<text x="180" y="224" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400">War between 0.69 and 1.45</text>
<text x="16" y="280" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">The AI backs down early only while temperature is between 50 and 99.</text>
</svg>
