<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Event flow. A monthly check per nation bucket finds eligible events that pass their trigger and cooldown. A fire chance decides whether one fires, which is picked by weight. For a player the event becomes pending and pauses the game. For an AI it picks a choice automatically. Then the effects are applied.">
<title>Event flow. A monthly check per nation bucket finds eligible events that pass their trigger and cooldown. A fire chance decides whether one fires, which is picked by weight. For a player the event becomes pending and pauses the game. For an AI it picks a choice automatically. Then the effects are applied.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="359" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">How an event happens</text>
<polyline points="154,78 204,78" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="354,78 394,78" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="459,102 459,141.4" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="394,165.4 354,165.4 354,169.4" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="459,189.4 459,228.8" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="279,197.4 279,228.8" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<polyline points="394,252.8 354,252.8" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahr)"/>
<rect x="14" y="54" width="140" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="84" y="74.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Monthly check</text>
<text x="84" y="89.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">(nation bucket)</text>
<rect x="204" y="54" width="150" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="279" y="74.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Eligible events:</text>
<text x="279" y="89.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">trigger and cooldown</text>
<rect x="394" y="54" width="130" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="459" y="82" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Fire chance</text>
<rect x="394" y="141.4" width="130" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="459" y="169.4" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Pick one by weight</text>
<rect x="204" y="141.4" width="150" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="279" y="166.2" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Player: pending, game</text>
<text x="279" y="180.7" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">pauses, you choose</text>
<rect x="394" y="228.8" width="130" height="48" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="459" y="249.6" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">AI: automatic</text>
<text x="459" y="264.1" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">choice</text>
<rect x="204" y="228.8" width="150" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="279" y="256.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Effects applied</text>
</svg>
