<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Grouped bar chart of days for a province to flip under siege. At fort level 0: 36 days with infantry only, 21 with artillery at half the stack, 19 with all artillery and 29 with a siegecraft general. At fort level 1 the same cases take 63, 37, 33 and 50 days.">
<title>Grouped bar chart of days for a province to flip under siege. At fort level 0: 36 days with infantry only, 21 with artillery at half the stack, 19 with all artillery and 29 with a siegecraft general. At fort level 1 the same cases take 63, 37, 33 and 50 days.</title>
<rect x="0.5" y="0.5" width="639" height="359" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">Days for a province to fall to a siege</text>
<line x1="62" y1="290" x2="618" y2="290" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="56" y="294" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">0</text>
<line x1="62" y1="255.14" x2="618" y2="255.14" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="56" y="259.14" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">10</text>
<line x1="62" y1="220.29" x2="618" y2="220.29" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="56" y="224.29" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">20</text>
<line x1="62" y1="185.43" x2="618" y2="185.43" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="56" y="189.43" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">30</text>
<line x1="62" y1="150.57" x2="618" y2="150.57" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="56" y="154.57" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">40</text>
<line x1="62" y1="115.71" x2="618" y2="115.71" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="56" y="119.71" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">50</text>
<line x1="62" y1="80.86" x2="618" y2="80.86" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="56" y="84.86" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">60</text>
<line x1="62" y1="46" x2="618" y2="46" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="56" y="50" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">70</text>
<line x1="62" y1="290" x2="618" y2="290" stroke="#a1a1aa" stroke-width="1" stroke-opacity="1"/>
<line x1="62" y1="46" x2="62" y2="290" stroke="#a1a1aa" stroke-width="1" stroke-opacity="1"/>
<text x="22" y="168" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400" transform="rotate(-90 22 168)">Days until the province flips</text>
<rect x="95.36" y="164.51" width="46.33" height="125.49" fill="#2563eb" fill-opacity="0.55"/>
<text x="118.53" y="159.51" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">36</text>
<rect x="148.64" y="216.8" width="46.33" height="73.2" fill="#2563eb" fill-opacity="0.9"/>
<text x="171.81" y="211.8" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">21</text>
<rect x="201.93" y="223.77" width="46.33" height="66.23" fill="#1e3a8a" fill-opacity="1"/>
<text x="225.09" y="218.77" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">19</text>
<rect x="255.21" y="188.91" width="46.33" height="101.09" fill="#dc2626" fill-opacity="0.85"/>
<text x="278.38" y="183.91" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">29</text>
<text x="201" y="308" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400">Fort level 0 (open ground)</text>
<rect x="373.36" y="70.4" width="46.33" height="219.6" fill="#2563eb" fill-opacity="0.55"/>
<text x="396.53" y="65.4" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">63</text>
<rect x="426.64" y="161.03" width="46.33" height="128.97" fill="#2563eb" fill-opacity="0.9"/>
<text x="449.81" y="156.03" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">37</text>
<rect x="479.93" y="174.97" width="46.33" height="115.03" fill="#1e3a8a" fill-opacity="1"/>
<text x="503.09" y="169.97" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">33</text>
<rect x="533.21" y="115.71" width="46.33" height="174.29" fill="#dc2626" fill-opacity="0.85"/>
<text x="556.38" y="110.71" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">50</text>
<text x="479" y="308" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400">Fort level 1 (hills and mountains)</text>
<rect x="80" y="55" width="12" height="12" fill="#2563eb" fill-opacity="0.55"/>
<text x="98" y="65" font-size="11.5" text-anchor="start" fill="#27272a" font-weight="400">Infantry only</text>
<rect x="80" y="71" width="12" height="12" fill="#2563eb" fill-opacity="0.9"/>
<text x="98" y="81" font-size="11.5" text-anchor="start" fill="#27272a" font-weight="400">Artillery 50% of stack</text>
<rect x="80" y="87" width="12" height="12" fill="#1e3a8a" fill-opacity="1"/>
<text x="98" y="97" font-size="11.5" text-anchor="start" fill="#27272a" font-weight="400">Artillery 100% of stack</text>
<rect x="80" y="103" width="12" height="12" fill="#dc2626" fill-opacity="0.85"/>
<text x="98" y="113" font-size="11.5" text-anchor="start" fill="#27272a" font-weight="400">Infantry, siegecraft general</text>
</svg>
