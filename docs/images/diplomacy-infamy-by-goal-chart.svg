<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Grouped bar chart of infamy added by declaring war for each war goal, with and without a pretext, against the outlaw limit of 18. Irredentist annexation adds 2.93 and unification 3.9. Annexing with a fabricated pretext totals 7.9, and two annexations without pretexts reach 22.8.">
<title>Grouped bar chart of infamy added by declaring war for each war goal, with and without a pretext, against the outlaw limit of 18. Irredentist annexation adds 2.93 and unification 3.9. Annexing with a fabricated pretext totals 7.9, and two annexations without pretexts reach 22.8.</title>
<rect x="0.5" y="0.5" width="639" height="379" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">Infamy added by declaring war, by war goal</text>
<line x1="56" y1="290" x2="622" y2="290" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="50" y="294" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">0</text>
<line x1="56" y1="230" x2="622" y2="230" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="50" y="234" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">6</text>
<line x1="56" y1="170" x2="622" y2="170" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="50" y="174" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">12</text>
<line x1="56" y1="110" x2="622" y2="110" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="50" y="114" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">18</text>
<line x1="56" y1="50" x2="622" y2="50" stroke="#e4e4e7" stroke-width="1" stroke-opacity="1"/>
<text x="50" y="54" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">24</text>
<line x1="56" y1="290" x2="622" y2="290" stroke="#a1a1aa" stroke-width="1" stroke-opacity="1"/>
<line x1="56" y1="50" x2="56" y2="290" stroke="#a1a1aa" stroke-width="1" stroke-opacity="1"/>
<text x="20" y="170" font-size="12" text-anchor="middle" fill="#27272a" font-weight="400" transform="rotate(-90 20 170)">Infamy added</text>
<line x1="56" y1="110" x2="622" y2="110" stroke="#dc2626" stroke-width="1.3" stroke-opacity="1" stroke-dasharray="5 4"/>
<text x="60" y="105" font-size="11" text-anchor="start" fill="#dc2626" font-weight="400">limit 18 (outlaw)</text>
<rect x="64.49" y="225" width="26.18" height="65" fill="#2563eb" fill-opacity="0.9"/>
<text x="77.58" y="221" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">6.5</text>
<rect x="92.67" y="176.25" width="26.18" height="113.75" fill="#dc2626" fill-opacity="0.9"/>
<text x="105.76" y="172.25" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">11.38</text>
<text x="91.38" y="305" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Annex</text>
<rect x="135.24" y="268" width="26.18" height="22" fill="#2563eb" fill-opacity="0.9"/>
<text x="148.33" y="264" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">2.2</text>
<rect x="163.42" y="250" width="26.18" height="40" fill="#dc2626" fill-opacity="0.9"/>
<text x="176.51" y="246" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">4</text>
<text x="162.13" y="305" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Liberate</text>
<rect x="205.99" y="276" width="26.18" height="14" fill="#2563eb" fill-opacity="0.9"/>
<text x="219.08" y="272" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">1.4</text>
<rect x="234.17" y="250" width="26.18" height="40" fill="#dc2626" fill-opacity="0.9"/>
<text x="247.26" y="246" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">4</text>
<text x="232.88" y="305" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Humiliate</text>
<rect x="276.74" y="272" width="26.18" height="18" fill="#2563eb" fill-opacity="0.9"/>
<text x="289.83" y="268" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">1.8</text>
<rect x="304.92" y="250" width="26.18" height="40" fill="#dc2626" fill-opacity="0.9"/>
<text x="318.01" y="246" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">4</text>
<text x="303.63" y="305" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Sphere</text>
<rect x="347.49" y="248" width="26.18" height="42" fill="#2563eb" fill-opacity="0.9"/>
<text x="360.58" y="244" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">4.2</text>
<rect x="375.67" y="216.5" width="26.18" height="73.5" fill="#dc2626" fill-opacity="0.9"/>
<text x="388.76" y="212.5" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">7.35</text>
<text x="374.38" y="305" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Colony</text>
<rect x="418.24" y="264" width="26.18" height="26" fill="#2563eb" fill-opacity="0.9"/>
<text x="431.33" y="260" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">2.6</text>
<rect x="446.42" y="244.5" width="26.18" height="45.5" fill="#dc2626" fill-opacity="0.9"/>
<text x="459.51" y="240.5" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">4.55</text>
<text x="445.13" y="305" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Cut down</text>
<rect x="488.99" y="260.75" width="26.18" height="29.25" fill="#2563eb" fill-opacity="0.9"/>
<text x="502.08" y="256.75" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">2.93</text>
<text x="515.88" y="305" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Irredentist</text>
<rect x="559.74" y="251" width="26.18" height="39" fill="#2563eb" fill-opacity="0.9"/>
<text x="572.83" y="247" font-size="10" text-anchor="middle" fill="#27272a" font-weight="400">3.9</text>
<text x="586.63" y="305" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Unification</text>
<rect x="80" y="67" width="12" height="12" fill="#2563eb" fill-opacity="1"/>
<text x="98" y="77" font-size="11.5" text-anchor="start" fill="#27272a" font-weight="400">With a pretext (cost on declaring)</text>
<rect x="80" y="83" width="12" height="12" fill="#dc2626" fill-opacity="0.9"/>
<text x="98" y="93" font-size="11.5" text-anchor="start" fill="#27272a" font-weight="400">Without a pretext (max of 4 and 1.75 x base)</text>
<text x="16" y="330" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">Annexing with a fabricated pretext costs 7.9 in total (6.5 + 1.4 to fabricate).</text>
<text x="16" y="346" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">Two unpretexted annexations reach 22.8, past the limit of 18.</text>
</svg>
