<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Five inputs sum into a war score bar from -100 to +100: occupation, capital, blockade, battles and exhaustion. Below the bar are the peace options: enforce goals up to your score, white peace, and automatic peace at pressure 65 or exhaustion 96.">
<title>Five inputs sum into a war score bar from -100 to +100: occupation, capital, blockade, battles and exhaustion. Below the bar are the peace options: enforce goals up to your score, white peace, and automatic peace at pressure 65 or exhaustion 96.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="399" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">How war score is built</text>
<rect x="16" y="56" width="116" height="62" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="74" y="70.4" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Occupation</text>
<text x="74" y="83.9" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">x48 share gap,</text>
<text x="74" y="97.4" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">plus goal progress</text>
<text x="74" y="110.9" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">x0.9</text>
<polyline points="74,119 74,150" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<rect x="140" y="56" width="116" height="62" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="198" y="83.9" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Capital</text>
<text x="198" y="97.4" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">+/-8</text>
<polyline points="198,119 198,150" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<rect x="264" y="56" width="116" height="62" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="322" y="83.9" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Blockade</text>
<text x="322" y="97.4" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">0.18 per province</text>
<polyline points="322,119 322,150" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<rect x="388" y="56" width="116" height="62" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="446" y="77.2" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Battle</text>
<text x="446" y="90.7" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">+/-3.4 per</text>
<text x="446" y="104.2" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">decisive result</text>
<polyline points="446,119 446,150" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<rect x="512" y="56" width="116" height="62" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="570" y="83.9" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">Exhaustion</text>
<text x="570" y="97.4" font-size="10.5" text-anchor="middle" fill="#27272a" font-weight="400">gap x0.35</text>
<polyline points="570,119 570,150" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<rect x="40" y="152" width="280" height="28" fill="#fecaca" stroke="#a1a1aa"/>
<rect x="320" y="152" width="280" height="28" fill="#bfdbfe" stroke="#a1a1aa"/>
<text x="40" y="198" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">-100</text>
<text x="320" y="198" font-size="11" text-anchor="middle" fill="#52525b" font-weight="400">0</text>
<text x="600" y="198" font-size="11" text-anchor="end" fill="#52525b" font-weight="400">+100</text>
<text x="180" y="171" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="400">War score: the other side ahead</text>
<text x="460" y="171" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="400">War score: you ahead</text>
<text x="16" y="226" font-size="12" text-anchor="start" fill="#27272a" font-weight="600">Peace options</text>
<rect x="16" y="244" width="190" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="111" y="266.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Enforce goals, up to your</text>
<text x="111" y="281.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">score</text>
<rect x="224" y="244" width="190" height="52" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="319" y="274" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">White peace</text>
<rect x="432" y="244" width="190" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="527" y="266.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Auto-peace at pressure 65</text>
<text x="527" y="281.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">or exhaustion 96</text>
<polyline points="111,206 111,242" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<polyline points="319,182 319,242" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<polyline points="527,182 527,242" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<text x="16" y="330" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">The five inputs add up to a score between -100 and +100.</text>
</svg>
