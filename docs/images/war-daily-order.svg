<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" width="640" height="314" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Phase order of runWarDaily: movement, supply and attrition, battles, sieges, mobilization upkeep, colonial claims, rebellions every third day, cleanup, war scores, auto-peace, then post-peace demobilization.">
<title>Phase order of runWarDaily: movement, supply and attrition, battles, sieges, mobilization upkeep, colonial claims, rebellions every third day, cleanup, war scores, auto-peace, then post-peace demobilization.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="313" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">One day of war, in order</text>
<rect x="10" y="58" width="620" height="138" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
<text x="44" y="131.2" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">Each day</text>
<rect x="80" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="79.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Movement</text>
<text x="130" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">(armies,</text>
<text x="130" y="108.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">fleets)</text>
<polyline points="181,90 191,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="192" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="242" y="86.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Supply and</text>
<text x="242" y="101.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">attrition</text>
<polyline points="293,90 303,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="304" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="354" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Battles</text>
<polyline points="405,90 415,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="416" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="466" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Sieges</text>
<polyline points="517,90 527,90" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="528" y="70" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="578" y="86.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Mobilization</text>
<text x="578" y="101.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">upkeep</text>
<polyline points="578,111 578,127 130,127 130,143" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="80" y="144" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="160.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Colonial</text>
<text x="130" y="175.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">claims</text>
<rect x="10" y="204" width="620" height="64" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
<text x="44" y="240.2" font-size="12" text-anchor="middle" fill="#27272a" font-weight="600">Then</text>
<rect x="80" y="216" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="225.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Rebellions</text>
<text x="130" y="240" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">(every 3rd</text>
<text x="130" y="254.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">day)</text>
<polyline points="181,236 191,236" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="192" y="216" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="242" y="240" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Cleanup</text>
<polyline points="293,236 303,236" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="304" y="216" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="354" y="240" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">War scores</text>
<polyline points="405,236 415,236" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="416" y="216" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="466" y="240" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Auto-peace</text>
<polyline points="517,236 527,236" fill="none" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahg)"/>
<rect x="528" y="216" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="578" y="232.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Post-peace</text>
<text x="578" y="247.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">demobilization</text>
<polyline points="102,185 102,192 102,192 102,215" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<text x="16" y="298" font-size="11" text-anchor="start" fill="#52525b" font-weight="400">Runs every day, before the weekly economy.</text>
</svg>
