<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' role="img" aria-label="Flow. Each month a power score (9 times the square root of industry, plus 2.5 times military, plus prestige) ranks nations. The top 8 become great powers ranked 1 to 8. Influence accrues by rank. 100 points makes a nation a client in a sphere. The patron gains 6 treasury and 0.08 prestige per client. Falling out of the top 8 releases all clients.">
<title>Flow. Each month a power score (9 times the square root of industry, plus 2.5 times military, plus prestige) ranks nations. The top 8 become great powers ranked 1 to 8. Influence accrues by rank. 100 points makes a nation a client in a sphere. The patron gains 6 treasury and 0.08 prestige per client. Falling out of the top 8 releases all clients.</title><defs><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="329" fill="#fff" stroke="#d4d4d8"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#27272a">How great powers and spheres form</text>
<polyline points="176,90 221,90" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="381,90 426,90" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="501,126 501,155.4" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="501,211.4 501,249" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ahb)"/>
<polyline points="301,126 301,155.4" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahr)"/>
<rect x="254.5" y="132.5" width="93.1" height="16.5" fill="#fff" fill-opacity="0.92" rx="3"/>
<text x="301" y="144" font-size="10.5" text-anchor="middle" fill="#dc2626" font-weight="400">if it drops out</text>
<rect x="16" y="54" width="160" height="72" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="96" y="79.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Monthly power score: 9</text>
<text x="96" y="94" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">x sqrt(industry) + 2.5</text>
<text x="96" y="108.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">x military + prestige</text>
<rect x="221" y="54" width="160" height="72" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="301" y="86.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Top 8 become great</text>
<text x="301" y="101.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">powers, rank 1 to 8</text>
<rect x="426" y="54" width="150" height="72" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="501" y="86.8" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Influence accrues,</text>
<text x="501" y="101.3" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">rank based</text>
<rect x="221" y="155.4" width="160" height="64" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="301" y="184.2" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Falls out of the top 8:</text>
<text x="301" y="198.7" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">all clients released</text>
<rect x="426" y="155.4" width="150" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="501" y="180.2" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">100 points makes a</text>
<text x="501" y="194.7" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">client sphere member</text>
<rect x="426" y="249" width="150" height="64" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="501" y="270.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">Patron gets +6</text>
<text x="501" y="285" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">treasury and +0.08</text>
<text x="501" y="299.5" font-size="11.5" text-anchor="middle" fill="#27272a" font-weight="400">prestige per client</text>
</svg>
