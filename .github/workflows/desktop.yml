name: desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to upload the installers to (optional)
        required: false
        default: ''
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'src/desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: bundle (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
            artifact: grandcentury-windows-x64
            paths: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - label: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
            artifact: grandcentury-linux-x64
            paths: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          - label: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: grandcentury-macos-arm64
            paths: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build the web app (relative base, no service worker)
        shell: bash
        env:
          VITE_BASE: ./
          VITE_DESKTOP: '1'
          VITE_MP_WS_URL: wss://gc-server.lakesidegames.net/ws
        run: |
          npm ci
          npm run build

      - name: Install desktop tooling
        working-directory: apps/desktop
        run: npm ci

      - name: Generate the icon set from the shared app icon
        working-directory: apps/desktop
        run: npx tauri icon ../mobile/assets/grand-century-icon.png

      - uses: tauri-apps/tauri-action@v0.6.2
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: List bundles
        shell: bash
        run: find apps/desktop/src-tauri/target -path '*bundle*' -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

      - name: Install, launch and screenshot (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Write-Host "Installing $($setup.FullName)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          $since = (Get-Date).AddMinutes(-15)
          $dirs = @(Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Directory -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt $since })
          Write-Host ("Recently written install dirs: " + (($dirs | ForEach-Object { $_.FullName }) -join '; '))
          $exe = $null
          foreach ($d in $dirs) {
            $found = Get-ChildItem $d.FullName -Filter *.exe -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'uninstall|setup' } | Select-Object -First 1
            if ($found) { $exe = $found; break }
          }
          if (-not $exe) { Write-Host 'No installed app exe found'; exit 1 }
          Write-Host "Launching $($exe.FullName)"
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          Write-Host "App exited: $($app.HasExited)"
          if ($app.HasExited) { Write-Host "App exit code: $($app.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$PWD\desktop-screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "Screenshot $($b.Width)x$($b.Height) saved"
          Write-Host '--- process list ---'
          Get-Process | Where-Object { $_.MainWindowTitle -ne '' -or $_.ProcessName -match 'GrandCentury|msedgewebview2' } | Select-Object ProcessName, Id, MainWindowTitle | Format-Table -AutoSize | Out-String | Write-Host
          Get-Process -Name GrandCentury, grandcentury-desktop -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'windows-latest'
        with:
          name: desktop-windows-screenshot
          path: desktop-screenshot.png
          if-no-files-found: warn

  release-upload:
    name: attach installers to release
    needs: bundle
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: grandcentury-*
          path: installers
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          ls -R installers
          find installers -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) -print0 \
            | xargs -0 gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY"
